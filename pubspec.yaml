name: pantry_logic
description: "Smart recipe ingestion, cadence-driven meal planning, and dynamic grocery lists."
publish_to: none
version: 1.0.2+3
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  drift: ^2.28.0
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path_provider_android: 2.2.19
  path: ^1.9.1
  http: ^1.5.0
  google_generative_ai: ^0.4.7
  html: ^0.15.6
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.3
  receive_sharing_intent: ^1.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
